<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المراكز - لوحة التحكم</title>
<link rel="stylesheet" href="dist/main.css">
<link rel="icon" href="data:,">
<style>
    /* جعل النص داخل خيارات القائمة باللون الأسود والخلفية بيضاء */
select option {
    color: black !important;
    background-color: white !important;
}
</style>
<script>
    // حماية الصفحة: التأكد من أن المستخدم هو Admin
    // قمنا بتعريف التوكن هنا ليكون متاحاً للصفحة وللملف الخارجي
    const globalToken = localStorage.getItem("authToken"); 
    const userType = localStorage.getItem("currentUserType");
    const isAdmin = localStorage.getItem("isAdmin");

    if (!globalToken || (userType?.toLowerCase() !== "admin" && isAdmin !== "true")) {
        window.location.href = "login.html";
    }
</script>

</head>
<body data-page="dashboard">

    <aside class="modern-sidebar">
        <a href="index.html" class="sidebar-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#009ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            معاهد الوحي
        </a>
        <div class="menu-label">القائمة الرئيسية</div>
        <a href="dashbord.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            لوحة التحكم
        </a>
        <div class="menu-label">الإدارة</div>
        <a href="admin-manage-centers.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4 8 4v14M8 21v-4h8v4"></path></svg>
            إدارة المراكز
        </a>
        <a href="admin-manage-courses.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            إدارة الدورات
        </a>
        <a href="admin-manage-users.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            المستخدمين
        </a>
        <a href="admin-messages.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            الرسائل
        </a>
        <div class="menu-label">النظام</div>
        <a href="admin-settings.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            الإعدادات
        </a>
        <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff5b5b; margin-top: auto;">
            تسجيل الخروج
        </a>
    </aside>

    <main class="dashboard-main">
        
        <header class="top-header">
            <div>
                <h2 style="margin:0; font-size: 1.5rem; color: white;">إدارة المراكز</h2>
                <p style="margin:0; opacity: 0.6; font-size: 0.9rem; color: #aaa;">إضافة واعتماد وتعديل المراكز القرآنية</p>
            </div>
            <div class="user-profile">
                <div style="text-align: left; color: white;">
                    <span style="display:block; font-weight:bold;">مدير النظام</span>
                    <span style="font-size: 0.8rem; opacity: 0.7;">Admin</span>
                </div>
                <div class="user-avatar">A</div>
            </div>
        </header>

        <div class="modern-table-container">
            <div class="table-controls">
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary btn-sm" onclick="openAddCenterModal()">+ إضافة مركز جديد</button>
                    <button class="btn btn-secondary btn-sm" onclick="filterCenters()" id="filterBtn">عرض المراكز المعلقة</button>
                </div>
                <div class="bw-search-wrapper" style="max-width: 300px;">
                    <input type="text" class="form-input" placeholder="بحث عن مركز..." style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;">
                </div>
            </div>

            <table class="modern-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم المركز</th>
                        <th>المدينة</th>
                        <th>حالة النشر</th>
                        <th>تاريخ الإضافة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="centersTableBody">
                    </tbody>
            </table>
        </div>

    </main>

    <div id="addCenterModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header" style="justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h2 class="modal-title" id="centerModalTitle" style="margin:0;">إضافة مركز جديد</h2>
                <button class="modal-close" onclick="closeAddCenterModal()" >&times;</button>
            </div>
            <div class="modal-body">
<form id="addCenterForm">
    <input type="hidden" id="centerId"> 

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label class="form-label">اسم المركز *</label>
            <input type="text" id="centerName" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">تصنيف المركز *</label>
            <select id="centerClassification" class="form-input" required>
                <option value="مشترك">مشترك</option>
                <option value="ذكور">ذكور</option>
                <option value="إناث">إناث</option>
            </select>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label class="form-label">اسم مدير المركز</label>
            <input type="text" id="centerManager" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">رقم الهاتف *</label>
            <input type="tel" id="centerPhone" class="form-input" required>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
        <div class="form-group">
            <label class="form-label">المدينة/المحافظة *</label>
            <select id="centerCity" class="form-input" required>
                 <option value="" style="color: black;">اختر المحافظة...</option> 
                 <option value="عمان" style="color: black;">عمان</option>
                 <option value="اربد" style="color: black;">اربد</option>
                 <option value="الزرقاء" style="color: black;">الزرقاء</option>
                 <option value="المفرق" style="color: black;">المفرق</option>
                 <option value="عجلون" style="color: black;">عجلون</option>
                 <option value="جرش" style="color: black;">جرش</option>
                 <option value="مادبا" style="color: black;">مادبا</option>
                 <option value="البلقاء" style="color: black;">البلقاء</option>
                 <option value="الكرك" style="color: black;">الكرك</option>
                 <option value="الطفيلة" style="color: black;">الطفيلة</option>
                 <option value="معان" style="color: black;">معان</option>
                 <option value="العقبة" style="color: black;">العقبة</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">اللواء</label>
            <input type="text" id="centerDistrict" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">المنطقة</label>
            <input type="text" id="centerArea" class="form-input">
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label class="form-label">الحي</label>
            <input type="text" id="centerNeighborhood" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">اسم الشارع</label>
            <input type="text" id="centerStreet" class="form-input">
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
        <div class="form-group">
            <label class="form-label">أقرب معلم</label>
            <input type="text" id="centerLandmark" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">رقم البناية</label>
            <input type="text" id="centerBuildingNo" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">الطابق</label>
            <input type="text" id="centerFloor" class="form-input">
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label class="form-label">أوقات الدوام</label>
            <input type="text" id="centerHours" class="form-input" placeholder="مثلاً: 4-8 مساءً">
        </div>
        <div class="form-group">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="centerEmail" class="form-input">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">العنوان الكامل (للعرض)</label>
        <input type="text" id="centerAddress" class="form-input" placeholder="سيظهر هذا العنوان في الكارت">
    </div>
    <div class="mb-3">
    <label for="centerPassword" class="form-label">كلمة المرور للحساب *</label>
    <input type="password" class="form-control" id="centerPassword" required minlength="6" placeholder="******">
</div>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;" id="centerModalSubmitBtn">حفظ البيانات</button>
</form>
            </div>
        </div>
    </div>
<script src="js/data/config.js"></script>
<script src="js/admin-manage-centers.js"></script>
<script>
    // ==========================================
// دالة تسجيل الخروج (عامة)
// ==========================================
window.logout = function() {
    // 1. حذف التوكن والبيانات
    localStorage.removeItem('authToken');
    localStorage.removeItem('currentUserType');
    localStorage.removeItem('isAdmin');
    
    // 2. التوجيه لصفحة الدخول
    window.location.href = 'login.html';
}
</script>
</body>
</html>
