    <!-- Login Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <!-- خيار نوع الحساب (مستطيل فيه خيارين) -->


<!-- قيمة مخفية علشان السكربت يقرأ النوع -->
<input type="hidden" id="accountMode" value="login">

                        <div class="login-icon"><span>📖</span></div>
                        <h2 id="loginTitle">تسجيل الدخول</h2>
                        <p id="loginSubtitle">أهلاً بك في منصة معاهد الوحي</p>
                    </div>
<div id="accountToggle" class="segmented-control" role="tablist">
    <button type="button" class="segmented-btn active" data-type="student">طالب</button>
    <button type="button" class="segmented-btn" data-type="teacher">معلم</button>
    <button type="button" class="segmented-btn" data-type="center">مركز</button>
</div>
                    <div class="error-message hidden" id="errorMessage">
                        <div class="error-content">
                            <span class="error-icon">⚠️</span>
                            <p id="errorText">البريد الإلكتروني أو كلمة المرور غير صحيحة</p>
                        </div>
                    </div>
               <form class="login-form" id="loginForm">
      
<div id="studentFields" class="hidden">        
        <div class="form-group">
            <label for="firstName" class="form-label">الاسم الأول *</label>
            <input type="text" id="firstName" name="firstName" class="form-input" placeholder="مثال: خالد" />
        </div>
        
        <div class="form-group">
            <label for="middleName" class="form-label">الاسم الثاني *</label>
            <input type="text" id="middleName" name="middleName" class="form-input" placeholder="مثال: محمد" />
        </div>
        
        <div class="form-group">
            <label for="lastName" class="form-label">اسم العائلة *</label>
            <input type="text" id="lastName" name="lastName" class="form-input" placeholder="مثال: العلي" />
        </div>
        
        <div class="form-group">
            <label for="age" class="form-label">العمر *</label>
            <input type="number" id="age" name="age" class="form-input" placeholder="مثال: 25" min="5" max="100" />
        </div>
        
    </div>
<div id="centerFields" class="hidden">
    <div class="form-group">
        <label for="centerName" class="form-label">اسم المركز *</label>
        <input type="text" id="centerName" class="form-input" placeholder="مثال: مركز الإيمان القرآني" />
    </div>
    
    <div class="form-group">
        <label for="centerPhone" class="form-label">رقم الهاتف *</label>
        <input type="tel" id="centerPhone" class="form-input" placeholder="07xxxxxxxx" />
    </div>

    <div class="form-group">
        <label for="centerManager" class="form-label">اسم المدير / المسؤول *</label>
        <input type="text" id="centerManager" class="form-input" placeholder="اسم المسؤول عن المركز" />
    </div>
</div>

<div id="teacherFields" class="hidden">
    <div class="form-group">
        <label for="teacherFirstName" class="form-label">الاسم الأول *</label>
        <input type="text" id="teacherFirstName" class="form-input" placeholder="الاسم الأول">
    </div>

    <div class="form-group">
        <label for="teacherMiddleName" class="form-label">الاسم الثاني *</label>
        <input type="text" id="teacherMiddleName" class="form-input" placeholder="اسم الأب">
    </div>

    <div class="form-group">
        <label for="teacherLastName" class="form-label">الاسم الأخير *</label>
        <input type="text" id="teacherLastName" class="form-input" placeholder="اسم العائلة">
    </div>

    <div class="form-group">
        <label for="teacherPhone" class="form-label">رقم الهاتف *</label>
        <input type="tel" id="teacherPhone" class="form-input" placeholder="07xxxxxxxx">
    </div>

    <div class="form-group">
        <label for="teacherSpecialty" class="form-label">التخصص *</label>
        <select id="teacherSpecialty" class="form-input" style="background:#333; color:white; border:1px solid #555">
            <option value="تجويد">أحكام تجويد</option>
            <option value="تحفيظ">تحفيظ قرآن</option>
            <option value="قراءات">قراءات</option>
            <option value="علوم شرعية">علوم شرعية</option>
        </select>
    </div>
</div>


    <div class="form-group">
        <label for="email" class="form-label">البريد الإلكتروني *</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="example@email.com" required />
    </div>
    
    <div class="form-group">
        <label for="password" class="form-label">كلمة المرور *</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="أدخل كلمة المرور" required />
    </div>
    
<button type="submit" class="btn btn-primary w-full" id="submitBtn">
            <span class="btn-icon">🔐</span>
        <span class="btn-text" id="submitText">تسجيل الدخول</span>

        <div class="spinner hidden" id="spinner"></div>
    </button>
    <div class="divider" style="text-align: center; margin: 20px 0; color: #aaa;">
    <span>أو</span>

</div>

<div id="googleBtn" style="display: flex; justify-content: center;"></div>
</form>
                    <div class="form-toggle">
                        <p>
                            <span id="toggleQuestion"style="color: #fff !important; ">ليس لديك حساب؟</span>
                            <button type="button" class="toggle-btn" id="toggleBtn">إنشاء حساب جديد</button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
