<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الطالب - معاهد الوحي</title>
  
  <link rel="stylesheet" href="dist/main.css">

  <style>
    body { background: #f6f8fa;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }
    .course-card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 2rem;
      transition: transform 0.3s ease;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .course-card:hover { transform: translateY(-5px); }
    
    .course-status {
      display: inline-block; 
      padding: 0.4em 0.8em;
       border-radius: 2rem;
      font-size: 0.85rem; font-weight: 600;
    }
    .status-active { background-color: #dcfce7; color: #16a34a; }
    .status-completed { background-color: #f3f4f6; color: #4b5563; }

    /* تحسينات للقائمة العلوية */
    .user-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-welcome-text { font-weight: 600; color: var(--primary); }
  </style>
</head>
<body data-page="dashboard">

    <aside class="modern-sidebar">
        <a href="index.html" class="sidebar-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#009ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            معاهد الوحي
        </a>
       <div class="dashboard-header">
    <div class="container">
        <h4 id="studentWelcomeHeader"></h4> 
        <p style="opacity: 0.9; font-size: 0.8rem; margin-top: 0.5rem;">تابع تقدمك في حفظ وتعلم كتاب الله</p>
    </div>
  </div>
        <div class="menu-label">الإدارة</div>
        <a href="student-dashboard.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            دوراتي
        </a>
        <a href="" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            الرسائل
        </a>
        <div class="menu-label">النظام</div>
        <a href="student-settings.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            الإعدادات
        </a>
        <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff5b5b; margin-top: auto;">
            تسجيل الخروج
        </a>
    </aside>
  

  <main class="container" style="min-height: 60vh;">
    
    <section style="margin-bottom: 4rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>📚 دوراتي المسجلة</h2>
            <a href="courses.html" class="btn btn-primary btn-sm">تصفح دورات جديدة</a>
        </div>
    </section>
    
    <section class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header">
            <h3>⚙️ الملف الشخصي</h3>
        </div>
        <div class="card-content">
            <form id="studentSettingsForm">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" class="form-input" id="profileName" disabled>
                    </div>
                     <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="form-input" id="profileEmail" disabled>
                    </div>
                </div>
            </form>
        </div>
    </section>

  </main>
  
  <script src="js/data/config.js"></script>
  <script src="dist/main.bundle.js"></script>

  <script>
    // ============================================
    // منطق صفحة الطالب (Front-End Logic)
    // ============================================
    
    const API_BASE_URL = CONFIG.getUrl(CONFIG.ENDPOINTS.STUDENT);
    const token = localStorage.getItem('authToken');

    // 1. حماية الصفحة: طرد غير المسجلين
    if (!token) {
        window.location.href = 'login.html';
    }

    // 2. التشغيل عند التحميل
    document.addEventListener('DOMContentLoaded', async () => {
        await loadStudentProfile();
        await loadStudentCourses();
    });

    // 3. دالة جلب الملف الشخصي
    async function loadStudentProfile() {
        try {
            const response = await fetch(`${API_BASE_URL}/profile`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) {
                logout(); // التوكن منتهي
                return;
            }

            const student = await response.json();

            // تحديث النصوص في الصفحة
            document.getElementById('studentWelcomeHeader').textContent = `مرحباً بك، ${student.fullName}`;
            document.getElementById('navbarStudentName').textContent = student.firstName;
            document.getElementById('profileName').value = student.fullName;
            document.getElementById('profileEmail').value = student.email;

        } catch (error) {
            console.error("Error loading profile:", error);
        }
    }

    // 4. دالة جلب الدورات
    async function loadStudentCourses() {
        const container = document.getElementById('studentCourses');
        container.innerHTML = '<p style="text-align:center; col-span:3;">جاري تحميل دوراتك...</p>';

        try {
            const response = await fetch(`${API_BASE_URL}/my-courses`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const courses = await response.json();

            if (courses.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem; background: white; border-radius: 1rem;">
                        <p style="font-size: 1.2rem; color: #666; margin-bottom: 1rem;">لست مسجلاً في أي دورة بعد.</p>
                        <a href="courses.html" class="btn btn-primary">ابدأ رحلتك الآن</a>
                    </div>
                `;
                return;
            }

            // رسم الكروت بناءً على البيانات القادمة من الباك إند
            container.innerHTML = courses.map(course => `
                <div class="course-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                        <h3 style="margin:0; color: #2c3e50;">${course.courseName}</h3>
                        <span class="course-status status-${course.status === 'Active' ? 'active' : 'completed'}">
                            ${course.status === 'Active' ? 'نشط' : 'مكتمل'}
                        </span>
                    </div>
                    
                    <p style="color:#666; margin-bottom:0.5rem;">
                        <span style="color:#4A7373;">🏛️</span> ${course.centerName}
                    </p>
                    
                    <div style="margin-top: 1.5rem;">
                        <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:0.5rem;">
                            <span>نسبة الإنجاز</span>
                            <span>${course.progress}%</span>
                        </div>
                        <div style="height:8px; background:#eee; border-radius:4px; overflow:hidden;">
                            <div style="width:${course.progress}%; background: #4A7373; height:100%;"></div>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            console.error(error);
            container.innerHTML = '<p style="color:red; text-align:center;">حدث خطأ أثناء تحميل الدورات.</p>';
        }
    }

    // 5. دالة تسجيل الخروج
    function logout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('currentUserType');
        localStorage.removeItem('isStudent');
        window.location.href = 'login.html';
    }
  </script>
</body>
</html>
