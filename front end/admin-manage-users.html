    <style>
        /* =========================================
           1. تنسيقات الصفحة (Dark Theme)
           ========================================= */
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
        }

        /* القائمة الجانبية (للتوضيح فقط) */
     /* 1. ضبط القائمة الجانبية */
aside {
    width: 260px; /* هذا عرض القائمة، تأكد أنه ثابت */
    position: fixed; /* تثبيت القائمة */
    right: 0; /* في اليمين لأن الموقع عربي */
    top: 0;
    height: 100vh; /* طول الشاشة كاملة */
    z-index: 1000; /* لتظهر فوق أي شيء آخر */
    background-color: #000; /* أو لونك المفضل */
    overflow-y: auto; /* إذا كانت القائمة طويلة جداً */
}
        
    /* 2. ضبط المحتوى الرئيسي (الحل هنا) */
main, .main-content {
    /* الإزاحة السحرية: يجب أن تساوي عرض القائمة الجانبية */
    margin-right: 260px !important; 
    
    /* ضمان أن العرض يأخذ المساحة المتبقية فقط */
    width: calc(100% - 260px); 
    
    padding: 20px;
    box-sizing: border-box; /* لضمان حساب المسافات بشكل صحيح */
    position: relative;
    z-index: 1;
}

/* 3. (اختياري) تحسين للشاشات الصغيرة/الموبايل */
@media (max-width: 768px) {
    aside {
        display: none; /* إخفاء القائمة في الموبايل (مؤقتاً) */
    }
    main, .main-content {
        margin-right: 0 !important; /* إلغاء الإزاحة في الموبايل */
        width: 100%;
    }
}
        /* =========================================
           2. تنسيقات الجدول
           ========================================= */
        .table-wrapper {
            background-color: #000;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            overflow-x: auto;
            margin-top: 20px;
        }

        .dark-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .dark-table th {
            color: #888;
            font-weight: bold;
            padding: 15px 10px;
            border-bottom: 1px solid #333;
        }

        .dark-table td {
            padding: 15px 10px;
            border-bottom: 1px solid #1a1a1a;
            vertical-align: middle;
            color: #ddd;
        }

        .dark-table tr:hover { background-color: #111; }

        /* الشارات (Badges) */
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; display: inline-block; }
        .bg-success { background: #052c18; color: #2ecc71; border: 1px solid #2ecc71; }
        .bg-warning { background: #2c2505; color: #f1c40f; border: 1px solid #f1c40f; }
        .bg-danger  { background: #3d1a1a; color: #e74c3c; border: 1px solid #e74c3c; }
        .bg-info    { background: #05202c; color: #3498db; border: 1px solid #3498db; }

        /* الأزرار */
        .action-btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; margin-left: 5px; font-size: 0.9em; }
        .btn-edit { background-color: #1e3a8a; color: #93c5fd; }
        .btn-delete { background-color: transparent; color: #ef4444; border: 1px solid #ef4444; }
        
        .add-btn {
            background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;
        }
        .add-btn:hover { background: #1d4ed8; }

        .search-input {
            background: #111; border: 1px solid #333; padding: 10px; color: white; border-radius: 5px; width: 300px;
        }

        /* =========================================
           3. تنسيقات النافذة المنبثقة (Modal)
           ========================================= */
        .modal-overlay {
            display: none; /* مخفي افتراضياً */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: white; }
        .close-btn { cursor: pointer; color: #aaa; font-size: 1.5rem; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #0d0d0d; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box;
        }

        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-save { background: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: transparent; color: #ccc; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  /* رفع مستوى الأزرار لتكون قابلة للنقر */
.action-btn, .btn, button {
    position: relative; /* ضروري لعمل الـ z-index */
    z-index: 500; /* رقم عالٍ لضمان ظهورها فوق الطبقات الشفافة */
    cursor: pointer;
}

/* التأكد من أن الجدول نفسه ليس مغطى */
.table-wrapper {
    position: relative;
    z-index: 10;
}
  </style>
</head>

    <main>
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: white; margin:0;">إدارة المستخدمين</h2>
        </header>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <input type="text" class="search-input" placeholder="بحث عن اسم أو بريد..." onkeyup="searchUsers(this.value)">
            <button class="add-btn" onclick="openAddUserModal()">+ إضافة مستخدم جديد</button>
        </div>

        <div class="table-wrapper">
            <table class="dark-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم الكامل</th>
                        <th>البريد الإلكتروني</th>
                        <th>الصلاحية</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="userModal" class="modal-overlay">

        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">إضافة مستخدم</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            
            <form onsubmit="saveUser(event)">
                <input type="hidden" id="userId">

                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="userName" required>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="userEmail" required>
                </div>

                <div class="form-group">
                    <label>الصلاحية</label>
                    <select id="userRole">
                        <option value="student">طالب</option>
                        <option value="teacher">معلم</option>
                        <option value="admin">مسؤول</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الحالة</label>
                    <select id="userStatus">
                        <option value="active">نشط</option>
                        <option value="pending">معلق</option>
                        <option value="banned">محظور</option>
                    </select>
                </div>
<div class="form-group">
    <label>كلمة المرور</label>
    <input type="password" id="userPassword" class="form-input" required placeholder="أدخل كلمة مرور للمستخدم">
</div>
<div class="form-group">
                <label>الصلاحية</label>
                <select id="userRole" class="form-input">
                    <option value="Student">طالب</option>
                    <option value="Center">مركز</option>
                    <option value="Admin">مسؤول</option>
                </select>
            </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn-save">حفظ</button>
                </div>
            </form>
        </div>
    </div>
