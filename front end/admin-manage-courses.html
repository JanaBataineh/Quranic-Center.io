<style>
    /* تنسيقات عامة للصفحة لمحاكاة الثيم الداكن */
    body {
        background-color: #0d0d0d; /* خلفية سوداء */
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 20px;
    }

    /* حاوية الجدول */
    .table-container {
        width: 100%;
        overflow-x: auto; /* للتمرير في الشاشات الصغيرة */
        background-color: #000;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        padding: 10px;
    }

    /* تنسيق الجدول */
    .styled-table {
        width: 100%;
        border-collapse: collapse;
        text-align: right; /* محاذاة لليمين */
    }

    /* ترويسة الجدول */
    .styled-table thead tr {
        border-bottom: 1px solid #333;
    }

    .styled-table th {
        padding: 15px;
        color: #a0a0a0; /* لون رمادي للعناوين */
        font-weight: bold;
        font-size: 0.9em;
    }

    /* صفوف البيانات */
    .styled-table tbody tr {
        border-bottom: 1px solid #1a1a1a;
        transition: background-color 0.2s;
    }

    .styled-table tbody tr:hover {
        background-color: #111; /* تأثير عند مرور الماوس */
    }

    .styled-table td {
        padding: 15px;
        vertical-align: middle;
    }

    /* تنسيق المعرف # (الهاش) */
    .id-cell {
        font-family: monospace;
        color: #888;
        font-size: 0.85em;
    }

    /* الشارات (Badges) للحالة والمستوى */
    .badge {
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 0.8em;
        font-weight: bold;
        display: inline-block;
    }

    .badge-status-published {
        background-color: #0f3d2e;
        color: #2ecc71;
        border: 1px solid #2ecc71;
    }

    .badge-level-beginner {
        background-color: #0f3d3d;
        color: #1abc9c;
        border: 1px solid #1abc9c;
    }
    
    .badge-level-advanced {
        background-color: #3d1a1a;
        color: #e74c3c;
        border: 1px solid #e74c3c;
    }
    
    .badge-level-intermediate {
        background-color: #3d341a;
        color: #f1c40f;
        border: 1px solid #f1c40f;
    }

    /* الأزرار */
    .action-buttons {
        display: flex;
        gap: 5px;
    }

    .btn {
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85em;
        text-decoration: none;
        border: none;
        color: white;
    }

    .btn-edit {
        background-color: #0d47a1; /* أزرق */
        border: 1px solid #2962ff;
    }

    .btn-delete {
        background-color: transparent;
        border: 1px solid #555;
        color: #aaa;
    }
    
    .btn-delete:hover {
        border-color: #e74c3c;
        color: #e74c3c;
    }

</style>
</head>

    <main class="dashboard-main">
        
        <header class="top-header">
            <div>
                <h2>إدارة الدورات التدريبية</h2>
                <p class="text-muted">عرض وتعديل واعتماد الدورات المتاحة</p>
            </div>
            <div class="user-profile">
                <div class="text-left">
                    <span class="block font-bold">مدير النظام</span>
                    <span class="text-sm text-muted">Admin</span>
                </div>
                <div class="user-avatar">A</div>
            </div>
        </header>
     <div class="modern-table-container">
    
    <div class="table-controls">
        <div class="flex gap-2">
            <button class="btn btn-primary btn-sm"onclick="openAddCourseModal()">
                + إضافة دورة</button>
            <button class="btn btn-glass btn-sm" 
            onclick="filterCourses()"id="filterBtn">
            عرض الدورات المعلقة</button>
        </div>
        
        <div class="search-input-wrapper" style="max-width: 300px;">
            <input type="text" class="form-input" placeholder="بحث عن دورة...">
            <svg class="search-icon">
                <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        </div>
    </div>

<div class="table-wrapper">
    <table class="dark-table">
        <thead>
            <tr>
                <th>#</th>
                <th>اسم الدورة</th>
                <th>المركز</th>
                <th>المستوى</th>
                <th>السعر</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="coursesTableBody">
            </tbody>
    </table>
</div>

    </table>

</div>

    </main>

    <div id="addCourseModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
        
            <div  class="modal-header flex justify-between items-center mb-4">
                <h2 id="courseModalTitle" class="text-lg">إضافة دورة جديدة</h2>
                <button class="modal-close" onclick="closeAddCourseModal()">&times;</button>
            </div>      
<form id="addCourseForm">
    <input type="hidden" id="courseId">

    <div class="form-group">
        <label class="form-label">اسم الدورة *</label>
        <input type="text" id="courseName" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label class="form-label">المركز التابع له *</label>
        <select id="courseCenterId" class="form-input" required>
            <option value="">جاري تحميل المراكز...</option>
        </select>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label class="form-label">المستوى *</label>
            <select id="courseLevel" class="form-input" required>
                <option value="مبتدئ" style="color:black">مبتدئ</option>
                <option value="متوسط" style="color:black">متوسط</option>
                <option value="متقدم" style="color:black">متقدم</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">السعر (د.أ) *</label>
            <input type="number" id="coursePrice" class="form-input" min="0" required>
        </div>
    </div>
    
    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px; width: 100%;" id="courseModalSubmitBtn">حفظ</button>
</form>
        </div>
    </div>
<script src="js/data/config.js"></script>
<script src="js/admin-manage-courses.js"></script>
<script>
    // ==========================================
// دالة تسجيل الخروج (عامة)
// ==========================================
window.logout = function() {
    // 1. حذف التوكن والبيانات
    localStorage.removeItem('authToken');
    localStorage.removeItem('currentUserType');
    localStorage.removeItem('isAdmin');
    
    // 2. التوجيه لصفحة الدخول
    window.location.href = 'login.html';
}
</script>
